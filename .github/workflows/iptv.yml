name: PT-IPTV Auto Update

on:
  schedule:
    # 每 4 小时自动采集/测速/排序/生成/回仓库
    - cron: '0 */4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'seed/**'

env:
  TZ: Asia/Shanghai

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run collector
        run: python collector/collector.py

      - name: Copy outputs to web/
        run: |
          cp out/live.json web/live.json
          cp out/live.txt web/live.txt
          cp out/cang.json web/cang.json

      - name: GetTime
        run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> "$GITHUB_ENV"

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add web/live.json web/live.txt web/cang.json out/state.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "自动更新：${GET_TIME}"
            git push origin main
          fi
